[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="synergy-quantlab"
version="2.0.0"
description="Leakage-safe strategy validation, purged walk-forward, OOS scoring and deployment gates"
requires-python=">=3.11"
dependencies=["numpy>=1.26,<3", "pandas>=2.1,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
enterprise=["psycopg[binary]>=3.2,<4","clickhouse-connect>=0.8,<1"]
dev=["pytest>=8.3,<9","httpx>=0.28,<1","ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]

[tool.ruff]
line-length=110
target-version="py311"
